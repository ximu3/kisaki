name: Release

on:
  push:
    tags:
      - 'desktop-v*'
      - 'extension-tooling-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, such as desktop-v0.0.4 or extension-tooling-v0.0.7.'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  NPM_VERSION: '11.18.0'
  # pnpm 11.11.0 deadlocks resolving electron-builder peers: https://github.com/pnpm/pnpm/issues/12921
  PNPM_VERSION: '11.10.0'

jobs:
  detect:
    name: Read Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      target: ${{ steps.parse.outputs.target }}
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      tag_prefix: ${{ steps.parse.outputs.tag_prefix }}
      release_name: ${{ steps.parse.outputs.release_name }}
      is_prerelease: ${{ steps.parse.outputs.is_prerelease }}
      make_latest: ${{ steps.parse.outputs.make_latest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Parse release tag
        id: parse
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: pnpm exec tsx .github/scripts/release/detect.ts

  validate-release:
    name: Validate Release Metadata
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        env:
          RELEASE_TARGET: ${{ needs.detect.outputs.target }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: pnpm exec tsx .github/scripts/release/validate.ts

  release-desktop:
    name: Build Desktop Release Artifacts
    needs: [detect, validate-release]
    if: needs.detect.outputs.target == 'desktop'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build:win

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-desktop-windows
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          overwrite: true

  build-extension-tooling-release:
    name: Build Extension Tooling Release Packages
    needs: [detect, validate-release]
    if: needs.detect.outputs.target == 'extension-tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm CLI
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify extension tooling version
        run: pnpm check:extension-tooling ${{ needs.detect.outputs.version }}

      - name: Build extension tooling
        run: pnpm build:extension-tooling

      - name: Verify extension tooling outputs
        run: pnpm verify:extension-tooling

      - name: Pack extension tooling packages
        run: pnpm exec tsx .github/scripts/release/targets/extension-tooling/pack.ts --out-dir ".tmp/release/extension-tooling/v${{ needs.detect.outputs.version }}"

      - name: Upload extension tooling artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-extension-tooling-packages
          path: |
            .tmp/release/extension-tooling/v${{ needs.detect.outputs.version }}/*.tgz
            .tmp/release/extension-tooling/v${{ needs.detect.outputs.version }}/SHA256SUMS
            .tmp/release/extension-tooling/v${{ needs.detect.outputs.version }}/PACKAGES.md
          if-no-files-found: error
          overwrite: true

  release-extension-tooling:
    name: Publish Extension Tooling To npm
    needs: [detect, build-extension-tooling-release]
    if: needs.detect.outputs.target == 'extension-tooling'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm CLI
        run: npm install --global npm@${{ env.NPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download extension tooling artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-extension-tooling-packages
          path: .tmp/release/extension-tooling/v${{ needs.detect.outputs.version }}

      - name: Verify extension tooling artifact checksums
        env:
          RELEASE_ARTIFACT_DIR: .tmp/release/extension-tooling/v${{ needs.detect.outputs.version }}
        run: pnpm exec tsx .github/scripts/release/checksums.ts

      - name: Publish extension tooling packages
        run: pnpm exec tsx .github/scripts/release/targets/extension-tooling/publish.ts --dir ".tmp/release/extension-tooling/v${{ needs.detect.outputs.version }}" --provenance

  publish-github-release:
    name: Publish GitHub Release
    needs: [detect, validate-release, release-desktop, release-extension-tooling]
    if: >-
      always() &&
      needs.validate-release.result == 'success' &&
      (needs.release-desktop.result == 'success' || needs.release-extension-tooling.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.detect.outputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          pattern: release-${{ needs.detect.outputs.target }}-*
          merge-multiple: true

      - name: Verify extension tooling release artifacts
        if: needs.detect.outputs.target == 'extension-tooling'
        env:
          RELEASE_ARTIFACT_DIR: artifacts
        run: pnpm exec tsx .github/scripts/release/checksums.ts

      - name: Find previous release tag
        id: previous_tag
        env:
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
          RELEASE_TAG_PREFIX: ${{ needs.detect.outputs.tag_prefix }}
        run: pnpm exec tsx .github/scripts/release/previous-tag.ts

      - name: Build release body
        env:
          PREVIOUS_TAG: ${{ steps.previous_tag.outputs.tag }}
          RELEASE_TARGET: ${{ needs.detect.outputs.target }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_TAG: ${{ needs.detect.outputs.tag }}
        run: pnpm exec tsx .github/scripts/release/body.ts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: ${{ needs.detect.outputs.release_name }}
          body_path: release-body.md
          files: |
            artifacts/*.exe
            artifacts/*.blockmap
            artifacts/latest.yml
            artifacts/*.tgz
            artifacts/SHA256SUMS
            artifacts/PACKAGES.md
          fail_on_unmatched_files: false
          overwrite_files: true
          draft: false
          prerelease: ${{ fromJSON(needs.detect.outputs.is_prerelease) }}
          make_latest: ${{ fromJSON(needs.detect.outputs.make_latest) }}
